<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDD Sensor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, sans-serif;
      padding: 28px;
    }
    main { max-width: 920px; margin: 0 auto; }
    h1 { margin: 0 0 6px; color: #58a6ff; font-size: 28px; }
    .sub { color: #8b949e; margin-bottom: 22px; }
    .buttons { display: flex; gap: 10px; margin-bottom: 16px; }
    button {
      background: #161b22;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 9px 14px;
      cursor: pointer;
    }
    button.active { border-color: #3fb950; color: #3fb950; }
    button.active2 { border-color: #d29922; color: #d29922; }
    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 18px;
    }
    .value {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 12px;
    }
    #numDisplay { font-size: 52px; font-weight: 700; color: #3fb950; }
    #unitDisplay, #nameDisplay { color: #8b949e; }
    canvas {
      width: 100%;
      height: 320px;
      display: block;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
    }
    .status {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 12px;
      color: #8b949e;
      font-size: 14px;
    }
    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f85149;
      margin-right: 6px;
    }
    .dot.on { background: #3fb950; }
  </style>
</head>
<body>
<main>
  <h1>CDD Sensor - Visualizador en tiempo real</h1>
  <div class="sub">RdC TP5 · Raspberry Pi · 1 Hz</div>

  <div class="buttons">
    <button id="btn1" class="active" onclick="selectSignal(1)">Senal 1 - GPIO17</button>
    <button id="btn2" onclick="selectSignal(2)">Senal 2 - GPIO27</button>
  </div>

  <section class="panel">
    <div class="value">
      <span id="numDisplay">--</span>
      <span id="unitDisplay">nivel logico</span>
      <span id="nameDisplay">Senal 1</span>
    </div>

    <canvas id="chart" width="860" height="320"></canvas>

    <div class="status">
      <span><span id="connDot" class="dot"></span><span id="connText">Desconectado</span></span>
      <span>Senal activa: <strong id="sigLabel">1</strong></span>
      <span>Muestras: <strong id="countLabel">0</strong></span>
      <span>Ultima: <strong id="tsLabel">--</strong></span>
    </div>
  </section>
</main>

<script>
let activeSig = 1;
let samples = [];
let count = 0;
const maxPoints = 60;

const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

function drawChart() {
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  ctx.strokeStyle = "#30363d";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = 20 + i * ((h - 40) / 4);
    ctx.beginPath();
    ctx.moveTo(40, y);
    ctx.lineTo(w - 20, y);
    ctx.stroke();
  }

  ctx.fillStyle = "#8b949e";
  ctx.font = "12px system-ui";
  ctx.fillText("1", 12, 26);
  ctx.fillText("0", 12, h - 20);

  if (samples.length < 2) return;

  ctx.strokeStyle = activeSig === 1 ? "#3fb950" : "#d29922";
  ctx.lineWidth = 3;
  ctx.beginPath();

  samples.forEach((p, i) => {
    const x = 40 + i * ((w - 60) / Math.max(maxPoints - 1, 1));
    const y = p.value ? 28 : h - 28;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });

  ctx.stroke();
}

function addPoint(event) {
  if (samples.length >= maxPoints) samples.shift();
  samples.push(event);

  document.getElementById("numDisplay").textContent = event.value;
  document.getElementById("unitDisplay").textContent = event.unit;
  document.getElementById("nameDisplay").textContent = event.name;
  document.getElementById("tsLabel").textContent = event.ts;

  count++;
  document.getElementById("countLabel").textContent = count;

  drawChart();
}

function resetView(sig, meta) {
  activeSig = sig;
  samples = [];
  count = 0;

  document.getElementById("btn1").className = sig === 1 ? "active" : "";
  document.getElementById("btn2").className = sig === 2 ? "active2" : "";
  document.getElementById("sigLabel").textContent = sig;
  document.getElementById("countLabel").textContent = "0";
  document.getElementById("numDisplay").textContent = "--";
  document.getElementById("numDisplay").style.color = sig === 1 ? "#3fb950" : "#d29922";
  document.getElementById("unitDisplay").textContent = meta.unit;
  document.getElementById("nameDisplay").textContent = meta.name;

  drawChart();
}

function selectSignal(sig) {
  fetch(`/select/${sig}`, { method: "POST" })
    .then(r => r.json())
    .then(meta => resetView(sig, meta));
}

function connectSSE() {
  const src = new EventSource("/stream");

  src.onopen = () => {
    document.getElementById("connDot").classList.add("on");
    document.getElementById("connText").textContent = "Conectado";
  };

  src.onmessage = e => {
    const event = JSON.parse(e.data);
    if (event.signal !== activeSig) {
      resetView(event.signal, event);
    }
    addPoint(event);
  };

  src.onerror = () => {
    document.getElementById("connDot").classList.remove("on");
    document.getElementById("connText").textContent = "Reconectando";
    src.close();
    setTimeout(connectSSE, 3000);
  };
}

drawChart();
connectSSE();
</script>
</body>
</html>
